[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mw-robotics"
version = "0.1.0"
description = "Modak-Walawalkar Framework, trimmed to a robotics PDE (flexible-link / soft-robot beam dynamics)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
  { name = "Rahul Modak", email = "rahul.modak@bayesiananalytics.in" },
  { name = "Rahul Walawalkar" },
]
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "torch>=2.0",
  "pyro-ppl>=1.8",
  "scikit-learn>=1.1",
]
keywords = ["bayesian", "vae", "manifold", "physics-informed", "anomaly-detection",
            "riemannian-geometry", "pyro"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
examples = ["matplotlib>=3.5"]
dev = ["pytest>=7", "matplotlib>=3.5"]

[project.urls]
Theory = "https://github.com/RahulModak74/MW_Geometric_Intelligence"

[project.scripts]
mw = "mw_framework.cli:main"

[tool.setuptools.packages.find]
include = ["mw_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
